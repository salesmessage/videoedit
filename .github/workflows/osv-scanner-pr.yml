name: OSV-Scanner

# Based on https://google.github.io/osv-scanner/github-action/
# - Pull requests (to any branch) and merge-queue runs get the diff scan, which
#   only fails on vulnerabilities the change introduces.
# - Pushes to main and develop (i.e. every merge) get a full scan of the tree.
on:
  pull_request:
  merge_group:
  push:
    branches: [main, develop]

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents
  contents: read

jobs:
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0"

  scan-push:
    if: github.event_name == 'push'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0"
